name: Release Meso-NH

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to release (e.g., v0.8.0)'
        required: true
        type: string
      push_branch:
        description: 'Push the mesonh branch to remote'
        required: false
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub release for Meso-NH'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  transform-mesonh:
    name: Transform Meso-NH Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version_tag }}"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_no_v=${VERSION_NO_V}" >> $GITHUB_OUTPUT
          echo "branch_name=mesonh_${VERSION}" >> $GITHUB_OUTPUT

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout version tag
        run: |
          git checkout ${{ steps.version.outputs.version }}

      - name: Install pyfortool with uvx
        run: |
          uvx --version
          uvx --from pyfortool pyfortool --version

      - name: Create Meso-NH working directory
        run: |
          mkdir -p mesonh_release

      - name: Merge common and Meso-NH-specific code
        run: |
          set -e

          # Subdirectories to process for Meso-NH
          SUBDIRS="turb micro aux conv ext"

          # Create target directory structure
          mkdir -p mesonh_release/src

          # Copy common code
          echo "Copying common source files..."
          for subdir in $SUBDIRS; do
            if [ -d "src/common/$subdir" ]; then
              echo "  - src/common/$subdir"
              cp -r "src/common/$subdir" mesonh_release/src/
            fi
          done

          # Overlay Meso-NH-specific code (overrides common)
          echo "Overlaying Meso-NH-specific files..."
          for subdir in $SUBDIRS; do
            if [ -d "src/mesonh/$subdir" ]; then
              echo "  - src/mesonh/$subdir"
              cp -r "src/mesonh/$subdir"/* mesonh_release/src/$subdir/ 2>/dev/null || true
            fi
          done

          # Copy Meso-NH-specific files
          if [ -f "src/mesonh/mesonh_version.json" ]; then
            cp src/mesonh/mesonh_version.json mesonh_release/
          fi

          if [ -f "src/mesonh/filesToSuppress.txt" ]; then
            cp src/mesonh/filesToSuppress.txt mesonh_release/
          fi

          echo "Merge complete"
          find mesonh_release/src -name "*.F90" | wc -l
          echo "Fortran files ready for transformation"

      - name: Transform code with pyfortool
        run: |
          set -e

          echo "Starting pyfortool transformation for Meso-NH..."
          echo "Options: --mnhExpand --lowerCase"
          echo "NOTE: OpenACC directives are KEPT for GPU support"

          # Find all Fortran files
          FORTRAN_FILES=$(find mesonh_release/src -name "*.F90" -o -name "*.f90")

          # Count files
          TOTAL_FILES=$(echo "$FORTRAN_FILES" | wc -l)
          echo "Found $TOTAL_FILES Fortran files to transform"

          # Transform each file
          COUNT=0
          for file in $FORTRAN_FILES; do
            COUNT=$((COUNT + 1))
            echo "[$COUNT/$TOTAL_FILES] Transforming: $file"

            # Determine output filename (lowercase extension)
            DIR=$(dirname "$file")
            BASENAME=$(basename "$file" .F90)
            if [[ "$file" == *.f90 ]]; then
              BASENAME=$(basename "$file" .f90)
            fi
            OUTPUT_FILE="${DIR}/${BASENAME}.f90"

            # Apply transformations using uvx
            # IMPORTANT: NO --removeACC for Meso-NH (keep OpenACC)
            uvx --from pyfortool pyfortool \
              --mnhExpand \
              --lowerCase \
              "$file" > "${OUTPUT_FILE}.tmp"

            # Replace original with transformed
            mv "${OUTPUT_FILE}.tmp" "$OUTPUT_FILE"

            # Remove old .F90 file if we created a .f90
            if [[ "$file" == *.F90 ]] && [[ "$OUTPUT_FILE" == *.f90 ]]; then
              rm -f "$file"
            fi
          done

          echo "Transformation complete!"

      - name: Remove suppressed files
        run: |
          set -e

          echo "Removing files listed in filesToSuppress.txt..."

          if [ -f mesonh_release/filesToSuppress.txt ]; then
            # Read each line and remove the file
            while IFS= read -r file_to_remove; do
              # Skip empty lines and comments
              if [[ -z "$file_to_remove" || "$file_to_remove" =~ ^# ]]; then
                continue
              fi

              # Remove the file
              FILE_PATH="mesonh_release/src/$file_to_remove"
              if [ -f "$FILE_PATH" ]; then
                echo "  Removing: $file_to_remove"
                rm -f "$FILE_PATH"
              else
                echo "  Not found (skipping): $file_to_remove"
              fi
            done < mesonh_release/filesToSuppress.txt

            echo "Files removed according to filesToSuppress.txt"
          else
            echo "No filesToSuppress.txt found, skipping suppression step"
          fi

      - name: Verify transformations
        run: |
          set -e

          echo "=== Verification Report ==="

          # Count OpenACC directives (should be PRESENT for Meso-NH)
          ACC_COUNT=$(find mesonh_release/src -name "*.f90" | \
                      xargs grep -c '!\$acc' 2>/dev/null | \
                      awk -F: '{sum+=$2} END {print sum}' || echo "0")
          echo "OpenACC directives found: $ACC_COUNT"

          if [ "$ACC_COUNT" -eq 0 ]; then
            echo "WARNING: No OpenACC directives found! GPU support may be missing."
          else
            echo "✓ OpenACC directives preserved for GPU execution ($ACC_COUNT directives)"
          fi

          # Count mnh_expand directives (should be 0 or minimal after expansion)
          MNH_COUNT=$(find mesonh_release/src -name "*.f90" | \
                      xargs grep -c '!\$mnh_expand' 2>/dev/null | \
                      awk -F: '{sum+=$2} END {print sum}' || echo "0")
          echo "mnh_expand directives remaining: $MNH_COUNT"

          if [ "$MNH_COUNT" -ne 0 ]; then
            echo "WARNING: Some mnh_expand directives remain!"
          else
            echo "✓ All mnh_expand directives successfully processed"
          fi

          # Count files
          f90_COUNT=$(find mesonh_release/src -name "*.f90" | wc -l)
          F90_COUNT=$(find mesonh_release/src -name "*.F90" | wc -l)
          echo "Total .f90 files (lowercase): $f90_COUNT"
          echo "Total .F90 files (uppercase): $F90_COUNT"

          if [ "$F90_COUNT" -ne 0 ]; then
            echo "WARNING: Some .F90 files remain (should be .f90 for Meso-NH)"
          else
            echo "✓ All files converted to lowercase .f90 extension"
          fi

          # Count suppressed files
          if [ -f mesonh_release/filesToSuppress.txt ]; then
            SUPPRESS_COUNT=$(grep -v '^#' mesonh_release/filesToSuppress.txt | grep -v '^$' | wc -l)
            echo "Files suppressed: $SUPPRESS_COUNT"
          fi

          echo "=== Verification Complete ==="

      - name: Create Meso-NH branch
        run: |
          set -e

          BRANCH_NAME="${{ steps.version.outputs.branch_name }}"

          # Create orphan branch for clean history
          git checkout --orphan "$BRANCH_NAME"

          # Remove all files from staging
          git rm -rf . || true

          # Copy transformed code
          cp -r mesonh_release/src .
          if [ -f mesonh_release/mesonh_version.json ]; then
            cp mesonh_release/mesonh_version.json .
          fi
          if [ -f mesonh_release/filesToSuppress.txt ]; then
            cp mesonh_release/filesToSuppress.txt .
          fi

          # Add README for Meso-NH branch
          cat > README.md << 'EOF'
          # PHYEX Meso-NH Branch

          This branch contains Meso-NH-specific code transformed from the master branch.

          ## Transformations Applied

          - **Array-syntax expanded** to explicit DO loops (`--mnhExpand`)
          - **Lowercase extension** (.f90 instead of .F90) (`--lowerCase`)
          - **OpenACC directives PRESERVED** for GPU execution (no `--removeACC`)

          ## GPU Support

          This code **retains OpenACC directives** and is ready for GPU compilation with:
          - NVIDIA HPC SDK (nvfortran -acc)
          - Preprocessor flag: `MNH_OPENACC`

          ## Source

          - **Master version**: ${{ steps.version.outputs.version }}
          - **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Workflow**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## Meso-NH Configuration

          See `mesonh_version.json` for Meso-NH reference version and test cases.

          ## Files Suppressed

          Files listed in `filesToSuppress.txt` have been removed as they already exist in Meso-NH or are not needed.

          ## Usage

          This code is ready for integration into Meso-NH builds with GPU support.

          For more information, see the [main PHYEX repository](${{ github.server_url }}/${{ github.repository }}).
          EOF

          # Stage all files
          git add .

          # Commit
          git commit -m "Meso-NH release ${{ steps.version.outputs.version }}

          Automated transformation from master branch.

          Transformations applied:
          - Array-syntax expanded to DO loops (--mnhExpand)
          - Files converted to lowercase .f90 (--lowerCase)
          - OpenACC directives PRESERVED for GPU support

          Source: ${{ steps.version.outputs.version }}
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Push Meso-NH branch
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.push_branch == 'true')
        run: |
          BRANCH_NAME="${{ steps.version.outputs.branch_name }}"
          git push origin "$BRANCH_NAME" --force

      - name: Create Meso-NH tag
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.push_branch == 'true')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH_NAME="${{ steps.version.outputs.branch_name }}"

          # Create annotated tag
          git tag -a "${VERSION}_mesonh" -m "Meso-NH release for ${VERSION}

          Transformed code for Meso-NH model integration with GPU support.

          Branch: ${BRANCH_NAME}
          Source: ${VERSION}
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

          # Push tag
          git push origin "${VERSION}_mesonh"

      - name: Create archive
        run: |
          BRANCH_NAME="${{ steps.version.outputs.branch_name }}"
          tar -czf "mesonh_${{ steps.version.outputs.version }}.tar.gz" \
            -C mesonh_release \
            src \
            mesonh_version.json \
            filesToSuppress.txt 2>/dev/null || \
          tar -czf "mesonh_${{ steps.version.outputs.version }}.tar.gz" \
            -C mesonh_release src

      - name: Upload Meso-NH archive
        uses: actions/upload-artifact@v4
        with:
          name: mesonh-release-${{ steps.version.outputs.version }}
          path: mesonh_${{ steps.version.outputs.version }}.tar.gz
          retention-days: 90

      - name: Create GitHub Release for Meso-NH
        if: |
          github.event.inputs.create_release == 'true' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}_mesonh
          name: Meso-NH Release ${{ steps.version.outputs.version }}
          body: |
            ## PHYEX Meso-NH Release ${{ steps.version.outputs.version }}

            This release contains Meso-NH-specific code transformed from master branch version ${{ steps.version.outputs.version }}.

            ### Transformations Applied

            - ✅ Array-syntax expanded to explicit DO loops
            - ✅ Files converted to lowercase `.f90` extension
            - ✅ **OpenACC directives PRESERVED** for GPU execution

            ### GPU Support

            This release **includes OpenACC directives** and supports GPU compilation:

            ```bash
            # Compile with NVIDIA HPC SDK
            nvfortran -acc -Minfo=accel -DMNH_OPENACC source.f90
            ```

            ### Branch Information

            - **Branch**: `${{ steps.version.outputs.branch_name }}`
            - **Source version**: `${{ steps.version.outputs.version }}`
            - **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            - **Reference version**: MNH-57X-dev-OPENACC-FFT-f314fd53

            ### Integration

            This code is ready for integration into Meso-NH builds with GPU support.

            ```bash
            # Extract the archive
            tar -xzf mesonh_${{ steps.version.outputs.version }}.tar.gz

            # Or clone the branch
            git clone -b ${{ steps.version.outputs.branch_name }} ${{ github.server_url }}/${{ github.repository }}.git
            ```

            ### Test Cases

            This release can be tested with Meso-NH test cases:
            - 007_16janvier/008_run2 (and variants)
            - COLD_BUBBLE/002_mesonh
            - ARMLES/RUN
            - OCEAN_LES/004_run2
            - 014_LIMA/002_mesonh

            ### Files Suppressed

            Files listed in `filesToSuppress.txt` have been removed as they already exist in Meso-NH.

            For more information, see the [Release Workflow](RELEASE_WORKFLOW.md) documentation.
          files: |
            mesonh_${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false

  summary:
    name: Release Summary
    needs: transform-mesonh
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## Meso-NH Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Transformation Status" >> $GITHUB_STEP_SUMMARY
          echo "- Code Transformation: ${{ needs.transform-mesonh.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.transform-mesonh.result }}" == "success" ]]; then
            echo "### Release Information" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ needs.transform-mesonh.outputs.version || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Branch**: \`mesonh_${{ needs.transform-mesonh.outputs.version || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Tool**: pyfortool (via uvx)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Transformations Applied" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Array-syntax expanded to DO loops (\`--mnhExpand\`)" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Files converted to lowercase .f90 (\`--lowerCase\`)" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **OpenACC directives PRESERVED** (GPU support enabled)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Key Difference from AROME/LMDZ" >> $GITHUB_STEP_SUMMARY
            echo "- 🎮 **GPU Ready**: OpenACC directives retained for GPU execution" >> $GITHUB_STEP_SUMMARY
            echo "- 📁 Lowercase .f90 extension (Meso-NH convention)" >> $GITHUB_STEP_SUMMARY
            echo "- 🗑️ Suppressed files removed per filesToSuppress.txt" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Subdirectories Processed" >> $GITHUB_STEP_SUMMARY
            echo "- turb (Turbulence schemes)" >> $GITHUB_STEP_SUMMARY
            echo "- micro (Microphysics)" >> $GITHUB_STEP_SUMMARY
            echo "- aux (Auxiliary routines)" >> $GITHUB_STEP_SUMMARY
            echo "- conv (Convection)" >> $GITHUB_STEP_SUMMARY
            echo "- ext (External modules)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Transformation failed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi
