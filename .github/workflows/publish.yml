name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      spack_version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  spack-create:
    name: Spack Create
    runs-on: ubuntu-latest
    steps:
      - name: Setup Spack
        uses: spack/setup-spack@v2

      - name: Spack Create
        env:
            SPACK_EDITOR: cat
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ inputs.spack_version }}"
          fi
          
          if [[ -z "$VERSION" ]]; then
            echo "No version specified"
            exit 1
          fi
          
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          echo "Running spack create for $URL"
          spack create --force $URL

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## PHYEX Package Release
            
            ### Spack
            ```bash
            spack install phyex@${{ github.ref_name }}
            ```

